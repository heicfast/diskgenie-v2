[package]
name = "scratch-win"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
publish = false

[features]
# The real crate's CI simulation feature (check-cfg parity: the real
# commands/license.rs gates on it; the mirror never enables it).
ci-license-sim = []

# The local compile gate for the app-crate files this session touched
# (state.rs, commands/{sidebar,dupes,snapshots_cmd}.rs). The FULL app
# crate cannot cross-compile on this host (aws-lc-sys builds C code),
# so the mirror #[path]-includes the REAL files against a stub `tauri`
# crate and a stub platform seam. Two verification modes:
#   cargo test                                  — the real unit tests run on the HOST
#   cargo clippy --target x86_64-pc-windows-msvc — the windows-cfg code compiles + lints
# The mirror is COMMITTED (sandbox resets killed the session-14 one).

[dependencies]
diskgenie-core = { path = "../../src-tauri/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rayon = "1.10"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ed25519-dalek = "2.2"
hmac = "0.12"
# TLS is deliberately OFF in the mirror: the reqwest transport's TLS
# backend (ring/aws-lc) builds C code that cannot cross-compile to
# msvc on this host; the mirror compiles the CALLERS (commands) and
# runs the module's unit tests with the scripted fake transport — the
# real TLS stack is exercised by the Windows/macOS CI builds.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tauri = { path = "tauri-stub" }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
