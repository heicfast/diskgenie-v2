<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskBytes</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Pre-CSS paint: the WebView's first frame matches the app canvas
         (#F5F5F7 light / #1C1C20 dark) instead of flashing white before
         the stylesheet arrives. Pairs with the window backgroundColor. */
      html {
        background: #f5f5f7;
      }
      html[data-theme="dark"] {
        background: #1e1e20;
      }
    </style>
    <script>
      // Pre-mount theme application (BuildPrompt §14): the saved theme
      // (localStorage) or prefers-color-scheme is applied BEFORE React
      // mounts so there is no flash. Runs synchronously in <head>.
      (function () {
        try {
          var saved = localStorage.getItem("diskbytes.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
