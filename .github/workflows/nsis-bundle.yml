name: NSIS bundle

# Bundle-only workflow (M11 resume, 2026-09-21): the full gates battery is
# GREEN on 1223082 (run 35638411781, chainproof-dev) — the account's
# Actions quota exhausted before the NSIS bundle job could start. This
# workflow re-runs ONLY the bundle job on the new home account so the
# M11 installer artifact lands without re-spending the gates minutes.
# Trigger: manual dispatch (the main CI on push keeps running the full
# battery incl. the bundle for future commits).

on:
  workflow_dispatch:

concurrency:
  group: nsis-bundle
  cancel-in-progress: true

jobs:
  bundle:
    name: Windows NSIS bundle (real build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: "M11: brand icon (source -> all sizes)"
        shell: pwsh
        run: scripts/make_icon.ps1

      - name: Build the NSIS installer (release)
        run: npx tauri build --target x86_64-pc-windows-msvc
        timeout-minutes: 30

      - name: "M11: portable zip + SHA256SUMS.txt"
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "$out/DiskGenie-$version-x64-setup.exe"
          $portable = "$out/portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/diskgenie.exe "$portable/DiskGenie.exe"
          @("DiskGenie portable. Runs without installing; WebView2 required.", "See docs/DISTRIBUTION.md for SmartScreen/Unblock guidance.") | Set-Content "$portable/README.txt"
          Compress-Archive -Path $portable -DestinationPath "$out/DiskGenie-$version-x64-portable.zip" -Force
          Remove-Item $portable -Recurse -Force
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskgenie-windows-release
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            dist-release/*
          if-no-files-found: error
