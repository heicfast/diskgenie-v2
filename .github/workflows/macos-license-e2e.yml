name: macOS License E2E (live worker)

# The REAL-FLOW license verification on macOS (session 17 — the
# owner's "detailed mac testing" ask): the PRODUCTION app (no
# ci-license-sim — the genuine licensing path) activates REAL keys
# minted per-run from the deployed Cloudflare worker, through the
# app's own UI code path:
#
#   admin-mint a lifetime key → launch unlicensed (the auto-dialog) →
#   the license tour: entry state → malformed-key rejection →
#   unknown-key rejection → REAL activation (Ed25519 token verified
#   against the production key, Keychain persist) → the Pro status
#   card with the REAL name/email/tier → Validate now (live) → the
#   unlocked app scanning the staged tree → quit → RELAUNCH: the
#   Keychain-cached state restores Pro at boot (no gate, no dialog) →
#   a yearly key minted + activated from a clean state (the tier +
#   expiry-date rendering) → admin-lookup asserts the mac device row
#   carries the real facts → revoke both keys (cleanup).
#
# Key material is never printed (last-4 only), never committed. The
# admin key lives in the repo secret LIVE_ADMIN_KEY (the same secret
# the Windows license E2E uses).

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: macos-license-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build the app (production, no bundle — the REAL license path)
        run: npx tauri build --no-bundle
        env:
          CARGO_INCREMENTAL: 0

      - name: Stage the synthetic tree
        run: bash scripts/ci/mac-stage-tree.sh

      - name: Install the resolution tool
        run: brew install displayplacer 2>&1 | tail -1 || true

      - name: Set up a writable Keychain (SecItemAdd targets the default)
        # The probe proved SecItemAdd BLOCKS on the runner's login
        # keychain (the Security agent wants UI a headless session
        # cannot show). The standard CI remedy: create a dedicated
        # keychain with a known password, unlock it, disable its lock
        # timeout, and make it the DEFAULT — SecItemAdd then targets an
        # unlocked keychain and returns without any agent round-trip.
        # (Codesigning CI has used this exact recipe for a decade.)
        run: |
          KC="$RUNNER_TEMP/diskgenie-ci.keychain-db"
          security create-keychain -p "ci-pass" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "ci-pass" "$KC"
          security default-keychain -s "$KC"
          echo "[kc] default keychain -> $KC"
          security default-keychain

      - name: Probe the runner's Keychain (write path evidence)
        # The activation persists via SecItemAdd (a generic-password
        # item in the DEFAULT keychain). The dedicated unlocked keychain
        # above is now that target; this direct Swift probe answers
        # whether the write path works BEFORE the app run muddies the
        # water.
        run: |
          cat > "$RUNNER_TEMP/kcprobe.swift" <<'SWIFT'
          import Foundation
          import Security
          let service = "app.diskgenie.ci-probe" as CFString
          let account = "ci-probe" as CFString
          var add: [String: Any] = [
              kSecClass as String: kSecClassGenericPassword,
              kSecAttrService as String: service,
              kSecAttrAccount as String: account,
              kSecValueData as String: Data("probe".utf8),
          ]
          let t0 = Date()
          SecItemDelete(add as CFDictionary)
          let status = SecItemAdd(add as CFDictionary, nil)
          print("[kcprobe] SecItemAdd status=\(status) ms=\(Int(Date().timeIntervalSince(t0) * 1000))")
          var query: [String: Any] = [
              kSecClass as String: kSecClassGenericPassword,
              kSecAttrService as String: service,
              kSecAttrAccount as String: account,
              kSecReturnData as String: true,
          ]
          var out: AnyObject?
          let rstatus = SecItemCopyMatching(query as CFDictionary, &out)
          print("[kcprobe] SecItemCopyMatching status=\(rstatus) data=\(out != nil)")
          exit(rstatus == errSecSuccess ? 0 : 1)
          SWIFT
          swiftc -O -o "$RUNNER_TEMP/kcprobe" "$RUNNER_TEMP/kcprobe.swift"
          timeout 15 "$RUNNER_TEMP/kcprobe" || echo "::warning::Keychain probe FAILED/timed out — SecItemAdd still blocks with a dedicated unlocked default keychain"

      - name: Mint the run's license keys
        id: mint
        env:
          ADMIN: ${{ secrets.LIVE_ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN" ]; then
            echo "::notice::LIVE_ADMIN_KEY secret not set — skipping the live E2E."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          API="https://diskbytes-license.heictojpg-pics.workers.dev"
          stamp=$(date +%Y%m%d%H%M%S)
          gen() {
            curl -sS --max-time 30 -X POST "$API/v1/admin/keys" \
              -H "authorization: Bearer $ADMIN" -H "content-type: application/json" -d "$1"
          }
          LIFETIME=$(gen "{\"tier\":\"lifetime\",\"customerName\":\"Mac E2E Lifetime\",\"customerEmail\":\"mac-e2e-$stamp@diskgenie.test\",\"note\":\"ci macos license e2e\"}")
          echo "lifetime response: $(echo "$LIFETIME" | python3 -c 'import json,sys; d=json.load(sys.stdin); k=d["keys"][0]["key"]; print("ok tier=" + d["keys"][0]["tier"] + " …" + k[-4:])')"
          KEY_LIFETIME=$(echo "$LIFETIME" | python3 -c 'import json,sys; print(json.load(sys.stdin)["keys"][0]["key"])')
          YEARLY=$(gen "{\"tier\":\"yearly\",\"days\":365,\"customerName\":\"Mac E2E Yearly\",\"customerEmail\":\"mac-yearly-$stamp@diskgenie.test\",\"note\":\"ci macos license e2e\"}")
          KEY_YEARLY=$(echo "$YEARLY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["keys"][0]["key"])')
          echo "yearly response ok …${KEY_YEARLY: -4}"
          # Per-run files under $RUNNER_TEMP (never echoed whole, never committed).
          printf '%s' "$KEY_LIFETIME" > "$RUNNER_TEMP/key-lifetime.txt"
          printf '%s' "$KEY_YEARLY" > "$RUNNER_TEMP/key-yearly.txt"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Phase A — the lifetime-key license tour
        if: steps.mint.outputs.skip != 'true'
        env:
          DISKGENIE_POSTHOG_KEY: ""
        run: |
          APP="$PWD/src-tauri/target/release/diskgenie"
          OUT="$RUNNER_TEMP/shots-a"
          mkdir -p "$OUT"
          KEY=$(cat "$RUNNER_TEMP/key-lifetime.txt")
          APP_BIN="$APP" \
          OUT_DIR="$OUT" \
          FRAMES=42 \
          BOOT_WAIT_S=5 \
          LAUNCH_ENV="DISKGENIE_SCAN=$HOME/diskgenie-test DISKGENIE_TOUR=1 DISKGENIE_TOUR_MODE=license DISKGENIE_TOUR_LICENSE_KEY=$KEY" \
          bash scripts/ci/mac-capture.sh
          echo "--- app-stderr tail ---"; tail -25 "$OUT/app-stderr.log" || true

      - name: Phase B — relaunch (Keychain persistence)
        if: steps.mint.outputs.skip != 'true'
        env:
          DISKGENIE_POSTHOG_KEY: ""
        run: |
          APP="$PWD/src-tauri/target/release/diskgenie"
          OUT="$RUNNER_TEMP/shots-b"
          mkdir -p "$OUT"
          LICENSE_BIN="$HOME/Library/Application Support/DiskGenie/license.bin"
          if [ -f "$LICENSE_BIN" ]; then
            echo "[e2e] license.bin present ($(stat -f%z "$LICENSE_BIN") bytes) — activation persisted"
          else
            echo "::warning::license.bin MISSING — the activation did not persist"
          fi
          APP_BIN="$APP" \
          OUT_DIR="$OUT" \
          FRAMES=6 \
          BOOT_WAIT_S=8 \
          CADENCE_MS=3000 \
          LAUNCH_ENV="DISKGENIE_SCAN=$HOME/diskgenie-test DISKGENIE_POSTHOG_KEY=" \
          bash scripts/ci/mac-capture.sh
          echo "--- persistence-relaunch stderr tail ---"; tail -12 "$OUT/app-stderr.log" || true

      - name: Phase C — the yearly key (tier + expiry rendering, clean state)
        if: steps.mint.outputs.skip != 'true'
        env:
          DISKGENIE_POSTHOG_KEY: ""
        run: |
          APP="$PWD/src-tauri/target/release/diskgenie"
          OUT="$RUNNER_TEMP/shots-c"
          mkdir -p "$OUT"
          # Clean local state: the yearly activation runs from the
          # genuine unlicensed entry state (not an overwrite-on-Pro).
          rm -f "$HOME/Library/Application Support/DiskGenie/license.bin"
          KEY=$(cat "$RUNNER_TEMP/key-yearly.txt")
          APP_BIN="$APP" \
          OUT_DIR="$OUT" \
          FRAMES=42 \
          BOOT_WAIT_S=5 \
          LAUNCH_ENV="DISKGENIE_SCAN=$HOME/diskgenie-test DISKGENIE_TOUR=1 DISKGENIE_TOUR_MODE=license DISKGENIE_TOUR_LICENSE_KEY=$KEY" \
          bash scripts/ci/mac-capture.sh

      - name: Verify the server-side device row (the mac facts landed)
        if: steps.mint.outputs.skip != 'true'
        env:
          ADMIN: ${{ secrets.LIVE_ADMIN_KEY }}
        run: |
          API="https://diskbytes-license.heictojpg-pics.workers.dev"
          KEY=$(cat "$RUNNER_TEMP/key-lifetime.txt")
          LOOK=$(curl -sS --max-time 30 -X POST "$API/v1/admin/lookup" \
            -H "authorization: Bearer $ADMIN" -H "content-type: application/json" \
            -d "{\"key\":\"$KEY\"}")
          LOOK="$LOOK" KEY="$KEY" python3 <<'PYEOF'
          import json
          import os
          d = json.loads(os.environ["LOOK"])
          lic = d["license"]
          print(f"[e2e] license id={lic['id']} email={lic['customerEmail']}")
          macs = [x for x in d.get("devices", []) if (x.get("osVersion") or "").startswith("macOS") or (x.get("arch") or "") in ("aarch64", "arm64", "x86_64")]
          assert macs, "no mac device row — the activation facts never landed server-side"
          dev = macs[0]
          print(f"[e2e] mac device: hostname={dev.get('hostname')} os={dev.get('osVersion')} arch={dev.get('arch')} ram={dev.get('ramMb')} model={dev.get('machineModel')}")
          # Rust's std::env::consts::ARCH reports "aarch64" on Apple Silicon
          # (the OS/CLT spelling is "arm64" — both are Apple-Silicon truths).
          assert (dev.get("arch") or "") in ("aarch64", "arm64", "x86_64"), "arch missing"
          assert dev.get("osVersion"), "os_version missing"
          assert dev.get("hostname"), "hostname missing"
          print("[e2e] device-row facts VERIFIED")
          PYEOF

      - name: Revoke the run's keys (cleanup)
        if: always() && steps.mint.outputs.skip != 'true'
        env:
          ADMIN: ${{ secrets.LIVE_ADMIN_KEY }}
        run: |
          API="https://diskbytes-license.heictojpg-pics.workers.dev"
          for f in "$RUNNER_TEMP/key-lifetime.txt" "$RUNNER_TEMP/key-yearly.txt"; do
            [ -f "$f" ] || { echo "[e2e] no key file $f — skipping"; continue; }
            KEY=$(cat "$f")
            ID=$(curl -sS --max-time 30 -X POST "$API/v1/admin/lookup" \
              -H "authorization: Bearer $ADMIN" -H "content-type: application/json" \
              -d "{\"key\":\"$KEY\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["license"]["id"])')
            if [ -n "$ID" ]; then
              curl -sS --max-time 30 -X POST "$API/v1/admin/keys/$ID/revoke" \
                -H "authorization: Bearer $ADMIN" -H "content-type: application/json" -d "{}" | head -c 120
              echo " — revoked key …${KEY: -4}"
            else
              echo "::warning::lookup failed for key …${KEY: -4} — revoke by hand"
            fi
          done

      - name: Upload phase artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diskgenie-macos-license-e2e
          path: |
            ${{ runner.temp }}/shots-a
            ${{ runner.temp }}/shots-b
            ${{ runner.temp }}/shots-c
          retention-days: 14
          if-no-files-found: warn
