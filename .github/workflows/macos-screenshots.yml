name: macOS Screenshots

# THE macOS screenshot workflow (the mac half of the owner's two-
# screenshot-set ask). The REAL app (license-sim feature, exactly
# like the Windows flow) over a BALANCED synthetic tree; the tour
# covers every mode, every tab, all five themes, the license dialog
# states, and the responsive window extremes. Capture is
# TITLE-SYNCED — exactly ONE NAMED FRAME PER TOUR STEP (the
# TourDriver stamps `tNN-name` into the window title; mac-capture.sh
# polls it via the CGWindowList probe, lets the step settle, and
# shoots window-exact frames on a 1920x1080 display). The cadence
# loop remains only as the zero-marker fallback.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: macos-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-audit-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build the app (release, no bundle, ci-license-sim)
        # The license-sim feature seeds a simulated activated license
        # (DISKGENIE_LICENSE_SIM=1 below) so the tour captures the
        # WORKING app and — via license_sim_set — the gate + Pro card.
        # It exists in no production bundle build (NSIS/MSIX/DMG).
        run: npx tauri build --no-bundle --features ci-license-sim
        env:
          CARGO_INCREMENTAL: 0

      - name: Stage the synthetic tree
        run: bash scripts/ci/mac-stage-tree.sh

      - name: Install the resolution tool (best-effort display bump)
        # The runner display defaults to 1024x768 — smaller than the
        # app's 1280x760 design floor, so the window exceeded the
        # screen and every capture cropped the right column ("zoomed").
        # displayplacer bumps it to 1920x1080 (the Windows flow's
        # Set-DisplayResolution equivalent).
        run: |
          brew install displayplacer 2>&1 | tail -1 || true
          displayplacer list 2>&1 | head -12 || true

      - name: Environment report
        run: |
          echo "== macOS =="; sw_vers
          echo "== display =="; system_profiler SPDisplaysDataType 2>/dev/null | sed -n '1,14p'
          echo "== disk free =="; df -h / | tail -1
          echo "== cores/mem =="; sysctl -n hw.ncpu hw.memsize

      - name: Run the app + capture the tour
        env:
          DISKGENIE_POSTHOG_KEY: ""
        run: |
          APP="$PWD/src-tauri/target/release/diskgenie"
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          APP_BIN="$APP" \
          OUT_DIR="$OUT" \
          SYNC_TITLE=1 \
          FRAMES=44 \
          BOOT_WAIT_S=5 \
          LAUNCH_ENV="DISKGENIE_SCAN=$HOME/diskgenie-test DISKGENIE_TOUR=1 DISKGENIE_MODE=Folders DISKGENIE_LICENSE_SIM=1 DISKGENIE_WINDOW=1440x860" \
          bash scripts/ci/mac-capture.sh
          # stdout/stderr live in the out dir — surface the tail for
          # instant diagnosis in the log (full files in the artifact).
          echo "--- app-stderr tail ---"; tail -30 "$OUT/app-stderr.log" || true
          echo "--- app-stdout tail ---"; tail -10 "$OUT/app-stdout.log" || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: diskgenie-macos-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: error
