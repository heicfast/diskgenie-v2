name: macOS Build

# The macOS half of the cross-platform release (owner decision:
# cross-platform doc §4, Option A — the SAME Tauri app + React frontend
# on macOS with platform-mac behind the Platform seam). Verifies:
# the app crate compiles on macOS, core tests stay green on a mac host,
# the .app + .dmg bundle builds, and the REAL bundle launches + paints
# (a window-exact smoke pass — production build, the genuine
# unlicensed first-run: the activation gate + dialog).
#
# Session 17: the old capture block was broken three ways — the full
# screen 1024x768 capture cropped the 1280x760-min window (every frame
# read "zoomed", the inspector column was never captured), `open
# --env` hid stdout/stderr, and the production build ran the tour
# UNLICENSED (every frame was the gate). The deep tour lives in
# macos-screenshots.yml (license-sim build, title-synced capture);
# this workflow keeps the bundle + dmg verification + the launch
# smoke. (Core/app TESTS run in CI's core-mac job on BOTH mac images
# — duplicated here once, they are gone.)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build the app + dmg
        run: npx tauri build
        env:
          CARGO_INCREMENTAL: 0

      - name: List bundles
        run: |
          ls -la src-tauri/target/release/bundle/macos || true
          ls -la src-tauri/target/release/bundle/dmg || true

      - name: Stage a synthetic file tree
        run: bash scripts/ci/mac-stage-tree.sh

      - name: Install the resolution tool (best-effort display bump)
        run: brew install displayplacer 2>&1 | tail -1 || true

      - name: Launch the .app bundle + capture the smoke pass
        env:
          DISKGENIE_POSTHOG_KEY: ""
        run: |
          set -e
          APP="src-tauri/target/release/bundle/macos/DiskGenie.app"
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          # Launch the BUNDLE via LaunchServices (the real install
          # path), then capture the window exactly like the audit
          # harness — the raw binary inside the bundle is the same
          # process the smoke needs (env + logs come along).
          BIN="$APP/Contents/MacOS/DiskGenie"
          APP_BIN="$BIN" \
          OUT_DIR="$OUT" \
          FRAMES=6 \
          BOOT_WAIT_S=5 \
          CADENCE_MS=3000 \
          FULL_CONTEXT=1 \
          LAUNCH_ENV="DISKGENIE_SCAN=$HOME/diskgenie-test DISKGENIE_WINDOW=1440x860" \
          bash scripts/ci/mac-capture.sh
          osascript -e 'tell application "DiskGenie" to quit' 2>/dev/null || true
          echo "--- bundle smoke stderr tail ---"; tail -15 "$OUT/app-stderr.log" || true
          ls -la "$OUT"

      - name: Upload mac smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: diskgenie-macos-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: warn

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: diskgenie-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: warn
